[project]
name = "sales-agents"
version = "0.1.0"
description = "Multi-agent cold email generator using OpenAI Agents SDK"
authors = [
    { name = "Nathan Kamusher", email = "natan.kamusher@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
